
name: Python automated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium and Firefox
        run: python -m playwright install --with-deps chromium firefox

      # NFR-05 tests run in branded Chrome and Edge; runner images usually ship both.
      - name: Ensure Google Chrome and Microsoft Edge are available
        run: |
          google-chrome --version || python -m playwright install chrome
          microsoft-edge --version || python -m playwright install msedge

      - name: Run automated tests
        run: |
          python -m pytest -v
