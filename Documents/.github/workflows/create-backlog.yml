name: Create product backlog

# Run this once from the Actions tab: Actions -> "Create product backlog" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create labels, sprint milestones, epics and user stories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 backlog/create_github_backlog.py --repo "${{ github.repository }}"
